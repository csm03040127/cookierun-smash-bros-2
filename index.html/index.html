/* Layout: one 16:9 arena frame centered on a plum-night ground; menus float over the canvas as layers sized in container units (cqw). */
:root{
  --night:#1b0e2c;   /* page ground */
  --ink:#2e1238;     /* outlines, dark text */
  --cream:#fff4e4;   /* card paper, light text */

  --butter:#ffc94a;  /* primary action, timer */
  --lilac:#cdb6e0;   /* secondary text on dark */

  --font-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}

  --fw:min(calc(100cqw - 32px), calc((100cqh - 24px) * 16 / 9));
  position:relative;width:var(--fw);height:calc(var(--fw) * 9 / 16);container-type:size;
  border-radius:clamp(6px,1.1cqw,16px);overflow:hidden;background:#2b1640;
  box-shadow:0 0 0 2px #4a2a63,0 18px 50px rgba(0,0,0,.55);
  user-select:none;-webkit-user-select:none;touch-action:none;
}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
kbd{font-family:var(--font-display);font-weight:400}

/* ---------- 메인 화면 · 캐릭터 선택 ----------

/* 키 설정 화면: 동작마다 키 칸 3개. 칸을 누르면 '키 입력…' 상태가 되고 다음에 누른 키가 들어감 */
#keyset{justify-content:flex-start;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.1) calc(var(--u)*2) calc(var(--u)*1.3);background:linear-gradient(180deg,rgba(27,14,44,.86) 0%,rgba(27,14,44,.7) 50%,rgba(27,14,44,.88) 100%)}

.s-tag{font-family:var(--font-display);font-size:calc(var(--u)*1.1);line-height:1.35;padding:0 calc(var(--u)*.7);border-radius:99px;border:calc(var(--u)*.18) solid var(--ink);background:var(--slot);color:var(--ink)}
.slot.p1 .s-tag{color:var(--cream)}
.s-now{display:none;font-size:calc(var(--u)*1);line-height:1.4;padding:0 calc(var(--u)*.7);border-radius:99px;background:rgba(27,14,44,.82);color:var(--cream)}
.slot.is-active:not(.is-empty) .s-now{display:block}
.s-info{display:flex;flex-direction:column;gap:calc(var(--u)*.4);padding:calc(var(--u)*.6) calc(var(--u)*1) calc(var(--u)*.75);min-height:0;flex:none}
.s-name{font-family:var(--font-display);font-size:calc(var(--u)*1.6);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-moves{display:flex;flex-direction:column;gap:calc(var(--u)*.25);font-size:calc(var(--u)*1);line-height:1.32}
.s-moves > span{display:flex;gap:calc(var(--u)*.45);align-items:baseline}
.s-moves kbd{flex:none;font-size:calc(var(--u)*.85);min-width:calc(var(--u)*1.5);padding:calc(var(--u)*.02) calc(var(--u)*.35);border-radius:calc(var(--u)*.3);background:var(--ink);color:var(--cream);text-align:center}
.s-moves b{font-weight:400;color:#7a2a6a}
.s-moves .cd{font-style:normal;white-space:nowrap;color:#8a6a96}
#select[data-mode="ffa"] .mv-more{display:none}
.s-stats{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.2) calc(var(--u)*.9);margin-top:auto;font-size:calc(var(--u)*.9);color:#6a4a78}
.s-stats > span{display:flex;align-items:center;gap:calc(var(--u)*.35)}
.pips{display:flex;gap:calc(var(--u)*.22)}
.pips i{width:calc(var(--u)*.75);height:calc(var(--u)*.75);border-radius:50%;border:calc(var(--u)*.14) solid var(--ink)}
.pips i.on{background:var(--ink)}
.slot.p1 .pips i.on{background:var(--berry)}
.s-empty{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.6);text-align:center;padding:calc(var(--u)*1)}
.slot.is-empty .s-empty{display:flex}
.s-empty b{font-family:var(--font-display);font-weight:400;font-size:calc(var(--u)*6);line-height:1;color:rgba(255,244,228,.3)}
.slot.is-active .s-empty b{color:var(--slot)}
.s-empty span{font-size:calc(var(--u)*1.15);line-height:1.4;color:var(--lilac)}
.s-empty small{font-size:.9em;color:var(--lilac)}
.slot.is-active .s-empty span{color:var(--cream)}
.s-clear{position:absolute;top:calc(var(--u)*.5);right:calc(var(--u)*.5);z-index:2;appearance:none;width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);padding:0;display:grid;place-items:center;font:inherit;font-size:calc(var(--u)*1.5);line-height:1;border-radius:50%;border:calc(var(--u)*.18) solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer}
.s-clear:hover{background:var(--butter)}
.s-clear:focus-visible{outline:calc(var(--u)*.25) solid var(--butter);outline-offset:calc(var(--u)*.15)}
.slot.is-empty .s-clear,.slot.is-preview .s-clear{display:none}
/* 1:1은 칸이 넓어서 왼쪽에 쿠키를 크게, 오른쪽에 기술 설명 */
#select[data-mode="duel"] .s-main{flex-direction:row}
#select[data-mode="duel"] .s-cv{width:calc(var(--u)*21);flex:none;min-height:0;height:auto;align-self:stretch;border-bottom:0;border-right:calc(var(--u)*.22) solid var(--ink)}
#select[data-mode="duel"] .s-info{flex:1;min-width:0;padding:calc(var(--u)*.9) calc(var(--u)*1.1) calc(var(--u)*.9)}
#select[data-mode="duel"] .s-name{margin-right:calc(var(--u)*2.4);font-size:calc(var(--u)*1.75)}
#select[data-mode="duel"] .s-moves{font-size:calc(var(--u)*1.06);gap:calc(var(--u)*.4)}
#select[data-mode="duel"] .s-stats{font-size:calc(var(--u)*.95)}
.vs{align-self:center;font-family:var(--font-display);font-size:calc(var(--u)*3.6);line-height:1;color:var(--butter);text-shadow:0 calc(var(--u)*.3) 0 var(--ink);margin:0 calc(var(--u)*.3)}
.s-foot{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);margin-top:auto}
.opt,.seg button,.start{white-space:nowrap}
.opt{display:flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.1);color:var(--lilac)}
.seg{display:flex;border:calc(var(--u)*.2) solid var(--ink);border-radius:99px;overflow:hidden;background:rgba(46,18,56,.85)}
.seg button{appearance:none;font:inherit;font-size:calc(var(--u)*1.1);color:var(--cream);background:transparent;border:0;padding:calc(var(--u)*.36) calc(var(--u)*1);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--cream);color:var(--ink)}
.seg button:focus-visible{outline:calc(var(--u)*.25) solid var(--butter);outline-offset:calc(var(--u)*-.25)}
.start{appearance:none;font-family:var(--font-display);font-size:calc(var(--u)*2);letter-spacing:.04em;padding:calc(var(--u)*.55) calc(var(--u)*3);border-radius:99px;background:var(--butter);color:var(--ink);border:calc(var(--u)*.26) solid var(--ink);box-shadow:0 calc(var(--u)*.42) 0 var(--ink);cursor:pointer;transition:transform .12s ease}
.start:not(:disabled):hover{transform:translateY(calc(var(--u)*-.2))}
.start:not(:disabled):active{transform:translateY(calc(var(--u)*.3));box-shadow:0 calc(var(--u)*.2) 0 var(--ink)}
.start:disabled{background:#7d6b8c;color:#3a2846;cursor:not-allowed;box-shadow:0 calc(var(--u)*.42) 0 rgba(46,18,56,.6)}
.start:focus-visible{outline:calc(var(--u)*.3) solid var(--cream);outline-offset:calc(var(--u)*.35)}

/* ---------- result ---------- */
#result{background:rgba(20,9,33,.66);padding:2cqw}
.panel{width:54cqw;display:flex;flex-direction:column;align-items:center;gap:.75cqw;padding:1.4cqw 2.2cqw 1.8cqw;text-align:center;background:var(--cream);color:var(--ink);border:.3cqw solid var(--ink);border-radius:2cqw;box-shadow:0 .8cqw 0 var(--ink)}
.r-eyebrow{margin:0;font-size:1.05cqw;letter-spacing:.32em;color:#7a5a88}
#r-head{margin:0;font-family:var(--font-display);font-weight:400;font-size:4.8cqw;line-height:1}
#result[data-outcome="win"] #r-head{color:var(--berry)}
#result[data-outcome="lose"] #r-head{color:#5d4a8a}
#result[data-outcome="draw"] #r-head{color:#c27c00}
#r-sub{margin:0;font-size:1.3cqw}
#r-cv{display:block;width:100%;height:auto;aspect-ratio:600/190;border-radius:1.2cqw;border:.22cqw solid var(--ink)}
.r-stats{width:100%;border-collapse:collapse;font-size:1.15cqw;font-variant-numeric:tabular-nums;table-layout:fixed}
.r-stats th,.r-stats td{padding:.28cqw .4cqw;border-bottom:.12cqw dashed rgba(46,18,56,.25);font-weight:400}
.r-stats thead th{font-size:1.05cqw;line-height:1.35;vertical-align:bottom}
.r-stats thead th:first-child{width:22%}
.r-stats tbody th{text-align:left;color:#6a4a78}
.r-stats .chip{display:inline-block;font-family:var(--font-display);font-size:.95cqw;padding:0 .6cqw;border-radius:99px;border:.14cqw solid var(--ink);color:var(--ink)}
.r-stats .chip.me{color:var(--cream)}
.r-stats td.me,.r-stats th.me{background:rgba(255,79,123,.1)}
.r-btns{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center;padding-top:.3cqw}
.btn{appearance:none;font-family:var(--font-display);font-size:1.6cqw;padding:.55cqw 2.1cqw;border-radius:99px;border:.28cqw solid var(--ink);cursor:pointer;box-shadow:0 .45cqw 0 var(--ink);transition:transform .12s ease}
.btn:hover{transform:translateY(-.2cqw)}
.btn:active{transform:translateY(.3cqw);box-shadow:0 .15cqw 0 var(--ink)}
.btn:focus-visible{outline:.3cqw solid var(--berry);outline-offset:.3cqw}
.btn.primary{background:var(--butter);color:var(--ink)}
.btn.ghost{background:var(--cream);color:var(--ink)}

/* ---------- misc ---------- */
#corner{position:absolute;right:1.2cqw;top:1.1cqw;display:flex;gap:.5cqw}
.cbtn{appearance:none;font-family:var(--font-ui);font-size:1cqw;padding:.3cqw 1cqw;border-radius:99px;border:.15cqw solid rgba(255,244,228,.4);background:rgba(46,18,56,.7);color:var(--cream);cursor:pointer}
.cbtn:hover{background:rgba(70,30,86,.85)}
.cbtn:focus-visible{outline:.2cqw solid var(--butter)}
/* 터치 조작: 프레임 높이(cqh) 기준으로 크기를 잡아 엄지가 닿기 쉽게 */
#touch{position:absolute;inset:0;pointer-events:none;-webkit-touch-callout:none}
#pad{position:absolute;left:3cqh;bottom:3.5cqh;width:42cqh;height:42cqh;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1cqh;border-radius:6cqh;background:rgba(36,14,48,.26);pointer-events:auto;touch-action:none}
/* 8방향 패드(모든 쿠키 공통): 3×3 칸 중 손가락이 있는 칸이 눌려요. ▲는 점프(지니·양탄자는 위로), 모서리는 대각선, 가운데는 멈춤 */
.pk{display:grid;place-items:center;border-radius:3cqh;border:.4cqh solid rgba(255,244,228,.72);background:rgba(36,14,48,.55);color:var(--cream);font-size:5.4cqh;line-height:1;pointer-events:none;transition:background .08s}
.pk-up{grid-column:2;grid-row:1}
.pk-down{grid-column:2;grid-row:3}
.pk[data-dir="left"]{grid-column:1;grid-row:2}
.pk[data-dir="right"]{grid-column:3;grid-row:2}
.pk.on,.tb.on{background:rgba(255,244,228,.38)}
.btns{position:absolute;right:3cqh;bottom:3.5cqh;display:grid;grid-template-columns:repeat(2,19cqh);grid-template-rows:repeat(2,19cqh);gap:2.2cqh;pointer-events:auto}
.tb{appearance:none;width:100%;height:100%;padding:0;border-radius:50%;border:.5cqh solid rgba(255,244,228,.75);background:rgba(36,14,48,.55);color:var(--cream);font-family:var(--font-display);font-size:5.6cqh;line-height:1;touch-action:none;-webkit-tap-highlight-color:transparent;transition:background .08s}
.tb.act{border-color:var(--butter);color:var(--butter)}
.tb.grd{border-color:#9fdcff;color:#9fdcff;font-size:4.4cqh}
.tb.big{transform:scale(1.1)}
.btns [data-act="skill"]{grid-column:2;grid-row:1}
.btns [data-act="guard"]{grid-column:1;grid-row:2}
.btns [data-act="attack"]{grid-column:2;grid-row:2}
#pause{position:absolute;left:2.4cqh;top:2.4cqh;width:12cqh;height:12cqh;font-size:4.6cqh;pointer-events:auto}
.touch .keys{display:none}
/* 일시정지 메뉴: 어두운 배경과 '일시정지' 글자는 캔버스가 그리고, 버튼은 그 아래에 DOM으로 */
#pausemenu{position:absolute;left:0;right:0;top:54%;display:flex;gap:1.4cqw;justify-content:center;flex-wrap:wrap;pointer-events:none}
#pausemenu .btn{pointer-events:auto}
#frame.paused #pad,#frame.paused .btns{pointer-events:none;opacity:.35}
.touch .pm-key{display:none}
/* 작은 화면(폰 가로, 좁은 창): 글자·버튼을 키우고 쿠키 버튼은 한 줄 10칸 */
@container (max-width: 1000px){
  #result:not([hidden]) ~ #corner{display:none}
  #menu{padding-top:calc(var(--u)*3)}
  .logo{font-size:calc(var(--u)*7.2)}
  .modes{gap:calc(var(--u)*3);margin-top:calc(var(--u)*2.4)}
  .mode{width:calc(var(--u)*33);padding:calc(var(--u)*1.6) calc(var(--u)*1.4) calc(var(--u)*1.8);gap:calc(var(--u)*.8)}
  .m-icon i{font-size:calc(var(--u)*1.75)}
  .m-icon b{font-size:calc(var(--u)*2.1)}
  .m-title{font-size:calc(var(--u)*4.6)}
  .m-sub{font-size:calc(var(--u)*1.8)}
  .legal{font-size:calc(var(--u)*1.55)}
  #select{gap:calc(var(--u)*1.1);padding:calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*1.1)}
  .s-head{min-height:calc(var(--u)*4.2)}
  .back{font-size:calc(var(--u)*1.9);padding:calc(var(--u)*.55) calc(var(--u)*1.7)}
  .s-title .eyebrow{display:none}
  #s-mode{font-size:calc(var(--u)*3.4)}
  .roster{grid-template-columns:repeat(var(--colsM,10),minmax(0,calc(var(--u)*11.2)));gap:calc(var(--u)*.8)}
  .ro-name{font-size:calc(var(--u)*var(--roFs,1.5));padding:calc(var(--u)*.5) calc(var(--u)*.1) calc(var(--u)*.55)}
  .ro-badge,.new-tag{font-size:calc(var(--u)*1.45);top:calc(var(--u)*-1.2)}
  .slots{height:auto;flex:1;min-height:0}
  .slot{width:calc(var(--u)*28)}
  #select[data-mode="duel"] .slot{width:calc(var(--u)*51)}
  #select[data-mode="duel"] .s-cv{width:calc(var(--u)*19)}
  #select[data-mode="ffa"] .s-cv{max-height:calc(var(--u)*15.5)}
  #select[data-mode="ffa"] .s-info{flex:1 0 auto}
  #select[data-mode="duel"] .s-name{font-size:calc(var(--u)*2.4);margin-right:calc(var(--u)*3.6)}
  #select[data-mode="duel"] .s-moves{font-size:calc(var(--u)*1.65)}
  #select[data-mode="duel"] .s-stats{font-size:calc(var(--u)*1.5)}
  .s-tag{font-size:calc(var(--u)*1.7)}
  .s-now{font-size:calc(var(--u)*1.5)}
  .s-name{font-size:calc(var(--u)*2.3)}
  .s-moves{font-size:calc(var(--u)*1.65);gap:calc(var(--u)*.35)}
  .s-moves kbd{font-size:calc(var(--u)*1.4);min-width:calc(var(--u)*2.2)}
  .s-stats{font-size:calc(var(--u)*1.5)}
  .pips i{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1)}
  .s-empty b{font-size:calc(var(--u)*7)}
  .s-empty span{font-size:calc(var(--u)*1.8)}
  .s-clear{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);font-size:calc(var(--u)*2.2)}
  .vs{font-size:calc(var(--u)*4.6)}
  .s-foot{gap:calc(var(--u)*1.7)}
  .opt,.seg button{font-size:calc(var(--u)*1.6)}
  .seg button{padding:calc(var(--u)*.55) calc(var(--u)*1.05)}
  .start{font-size:calc(var(--u)*2.4);padding:calc(var(--u)*.65) calc(var(--u)*2.6)}
  #corner{gap:1cqw}
  .cbtn{font-size:1.6cqw;padding:.5cqw 1.4cqw}
  .panel{width:74cqw;gap:.75cqw;padding:1.5cqw 2.6cqw 1.9cqw}
  #r-cv{display:none}
  .r-eyebrow{font-size:1.6cqw}
  #r-head{font-size:6cqw}
  #r-sub{font-size:2cqw}
  .r-stats{font-size:1.85cqw}
  .r-stats thead th{font-size:1.6cqw}
  .r-stats .chip{font-size:1.5cqw}
  .btn{font-size:2.5cqw;padding:.85cqw 3cqw}
  #loading{font-size:2.4cqw}
}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6cqw;color:var(--lilac);background:#2b1640}
@media (prefers-reduced-motion:reduce){.mode,.ro,.start,.btn,.m-keys,.kc{transition:none}.kc.is-cap,.kc.is-new{animation:none}.slot.is-active .s-main{animation:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" aria-label="쿠키런 대난투 경기장"></canvas>

  <section id="menu" class="layer" aria-label="메인 화면">
    <header class="m-head">
      <p class="eyebrow">COOKIERUN BRAWL</p>
      <h1 class="logo">쿠키런 대난투</h1>
    </header>
    <div class="modes">
      <button type="button" class="mode" data-mode="duel">
        <span class="m-icon" aria-hidden="true"><i class="p1" style="--c:#ff4f7b">1P</i><b>VS</b><i style="--c:#2ec4c6">CPU</i></span>
        <span class="m-title">1:1 대전</span>
        <span class="m-sub">CPU 한 명과 스톡 3개로 승부</span>
      </button>
      <button type="button" class="mode" data-mode="ffa">
        <span class="m-icon" aria-hidden="true"><i class="p1" style="--c:#ff4f7b">1P</i><i style="--c:#2ec4c6">CPU2</i><i style="--c:#ffc94a">CPU3</i><i style="--c:#8be05a">CPU4</i></span>
        <span class="m-title">4인 난전</span>
        <span class="m-sub">CPU 세 명과 최후의 1인 가리기</span>
      </button>
    </div>
    <button type="button" class="m-keys" id="m-keys"><svg viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="1" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 5.2h2M9 5.2h2M13 5.2h2M17 5.2h2M5 8.6h2M9 8.6h2M13 8.6h2M17 8.6h2M7.5 12h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>키 설정</button>
    <div class="m-foot">
      <p class="keys">
        <span><kbd>A</kbd><kbd>D</kbd> 이동</span>
        <span><kbd>W</kbd>/<kbd>Space</kbd> 점프 (공중 2단)</span>
        <span><kbd>S</kbd>/<kbd>↓</kbd> 발판 아래로</span>
        <span><kbd>F</kbd> 기본 공격</span>
        <span><kbd>G</kbd> 필살기</span>
        <span><kbd>H</kbd>/<kbd>Shift</kbd> 가드</span>
        <span><kbd>P</kbd> 일시정지</span>
      </p>
      <p class="legal">CookieRun은 devsisters의 소유이며 이 게임은 비영리 목적의 팬 게임입니다.</p>
    </div>
  </section>

  <section id="select" class="layer" aria-label="캐릭터 선택" data-mode="duel" hidden>
    <header class="s-head">
      <button type="button" class="back" id="back">← 메인</button>
      <div class="s-title"><p class="eyebrow">CHARACTER SELECT</p><h2 id="s-mode">1:1 대전</h2></div>
    </header>
    <div class="roster" id="roster" role="group" aria-label="쿠키 목록"></div>
    <div class="slots" id="slots" role="group" aria-label="참가 칸"></div>
    <div class="s-foot">
      <div class="opt"><span id="lv-label">난이도</span>
        <div class="seg" role="radiogroup" aria-labelledby="lv-label" id="lv-seg">
          <button type="button" id="lv-easy" role="radio" data-lv="easy" aria-checked="false">쉬움</button>
          <button type="button" id="lv-normal" role="radio" data-lv="normal" aria-checked="true">보통</button>
          <button type="button" id="lv-hard" role="radio" data-lv="hard" aria-checked="false">어려움</button>
        </div>
      </div>
      <div class="opt"><span id="tm-label">시간</span>
        <div class="seg" role="radiogroup" aria-labelledby="tm-label" id="tm-seg">
          <button type="button" id="tm-60" role="radio" data-tm="60" aria-checked="true">60초</button>
          <button type="button" id="tm-99" role="radio" data-tm="99" aria-checked="false">99초</button>
          <button type="button" id="tm-0" role="radio" data-tm="0" aria-checked="false">무제한</button>
        </div>
      </div>
      <div class="opt"><span id="st-label">맵</span>
        <div class="seg" role="radiogroup" aria-labelledby="st-label" id="st-seg">

function buildFx() {
  const make = (pal, seed) => {
    const c = document.createElement('canvas'); c.width = FX.cellW * FX.n * FX.s; c.height = FX.cellH * FX.s;
    const g = c.getContext('2d'); g.scale(FX.s, FX.s);
    for (let i = 0; i < FX.n; i++) paintBolt(g, i * FX.cellW + FX.cellW / 2, FX.cellH, rng(seed + i * 7), pal);
    return c;
  };

}
function paintBolt(g, cx, h, R, pal) {
  const pts = [[cx + (R() - .5) * 20, 0]];
  let y = 0;
  while (y < h) { y = Math.min(h, y + 24 + R() * 42); pts.push([cx + (R() - .5) * 46, y]); }
  const branches = [];
  for (let b = 0; b < 4; b++) {
    const i0 = 2 + Math.floor(R() * (pts.length - 4)); let [bx, by] = pts[i0]; const dir = R() < .5 ? -1 : 1; const bp = [[bx, by]];
    for (let k = 0; k < 3; k++) { bx += dir * (6 + R() * 10); by += 18 + R() * 24; bp.push([bx, by]); }
    branches.push(bp);
  }
  const stroke = (p, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'miter'; g.lineCap = 'round'; g.beginPath(); p.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke(); };
  for (const p of [pts, ...branches]) stroke(p, p === pts ? 34 : 18, pal[0]);
  for (const p of [pts, ...branches]) stroke(p, p === pts ? 15 : 8, pal[1]);
  for (const p of [pts, ...branches]) stroke(p, p === pts ? 8 : 4, pal[2]);
}
function drawBolt(g, variant, x, top, bottom, width, alpha, purple) {
  const cv = purple ? FX.cvP : FX.cv;
  if (!cv) return;
  g.save(); g.globalAlpha = alpha;
  g.drawImage(cv, variant * FX.cellW * FX.s, 0, FX.cellW * FX.s, FX.cellH * FX.s, x - width / 2, top, width, bottom - top);
  g.restore();

    if (this.partner) this.chessTick(dt, c);                          // 체스초코: F 꾹 눌러 리더 교체

    if (!this.onGround && !(this.action && this.action.noGrav)) {
      const fast = c.down && !this.action && this.hitstun <= 0 && this.vy > 0;
      this.vy += GRAV * (fast ? 1.6 : 1) * dt;
      const mf = MAXFALL * (fast ? 1.4 : 1);
      if (this.hitstun <= 0 && this.vy > mf) this.vy = mf;
    }
    this.move(dt);
    if (this.onGround && Math.abs(this.vx) > 30 && !this.action && this.hitstun <= 0 && !this.guarding) this.walkDist += Math.abs(this.vx) * dt;
  }

  doJump(c) {
    const d = this.def, dbl = !this.onGround;
    c.buf.jump = 0;
    if (!dbl) { this.vy = -d.jump; dust(this.x, this.y, 6); }
    else { this.vy = -d.djump; P({ type: 'ring', x: this.x, y: this.y, r0: 6, r1: 34, size: 4, color: '#fff', life: .25, alpha: .8 }); }
    this.jumps--; this.onGround = false; this.guarding = false; Sfx.jump(dbl);
  }
  control(dt, c) {
    const d = this.def;
    const dir = (c.right ? 1 : 0) - (c.left ? 1 : 0);
    // 가드: 땅 위에서 H/Shift를 누르고 있는 동안 (점프로만 빠져나갈 수 있음)
    if (c.guard && this.onGround && this.shield > 0) {
      this.guarding = true;
      if (dir) this.facing = dir; else if (c.face) this.facing = c.face;
      this.vx = approach(this.vx, 0, 3000 * dt);
      this.shield -= SHIELD_DRAIN * dt;
      c.buf.attack = 0; c.buf.skill = 0;
      if (this.shield <= 0) { this.breakGuard(); return; }
      if (c.buf.jump > 0 && this.jumps > 0) this.doJump(c);
      return;
    }
    this.guarding = false;
    if (dir) this.facing = dir; else if (c.face) this.facing = c.face;
    if (this.onGround) {
      this.vx = approach(this.vx, dir * d.run, (dir ? 3200 : 2600) * dt);
      if (dir && Math.abs(this.vx) > 200 && Math.random() < dt * 6) dust(this.x - dir * 12, this.y, 1, -dir);
    } else {
      let acc = dir ? 1800 : 420;
      if (Math.abs(this.vx) > d.air + 1) acc = dir && Math.sign(dir) !== Math.sign(this.vx) ? 950 : 420;
      this.vx = approach(this.vx, dir * d.air, acc * dt);
      if (c.down) this.dropT = Math.max(this.dropT, .06);
    }
    if (c.buf.drop > 0 && this.onGround && this.ground !== MAIN) {
      c.buf.drop = 0; this.dropT = .26; this.onGround = false; this.y += 4; this.vy = Math.max(this.vy, 140); this.jumps = Math.min(this.jumps, 1);
    }
    if (c.buf.jump > 0 && this.jumps > 0) this.doJump(c);
    if (c.buf.attack > 0) { c.buf.attack = 0; this.startAttack(this.comboWin > 0 ? 2 : 1); }
    else if (c.buf.skill > 0 && this.skillCd <= 0 && (!this.def.skill.groundOnly || this.onGround)) {   // 지상 전용 기술은 공중에선 입력이 잠깐 남아 있다가 착지하면 나감
      c.buf.skill = 0;
      if (this.hackT > 0) this.hackDenied(); else if (this.def.skill.type === 'chess' && !this.chessCan()) { /* 파트너가 없거나 멀거나 퀸을 땅에서 쓰려 함: 안내만 띄우고 나가지 않음 */ } else this.startSkill();
    }
  }
  /* 해킹당한 동안 필살기를 쓰려 하면 막힘 */
  hackDenied() {
    if (this.hackDeny > 0) return;
    this.hackDeny = .5; Sfx.deny();
    floatText(this.x, this.y - this.def.h - 30, '해킹됨!', '#7dffa0', 26);
    P({ type: 'ring', x: this.x, y: this.y - 50, r0: 8, r1: 46, size: 4, color: '#43ff86', life: .25 });
  }

  startAttack(stage) {
    if (this.def.lamp) { this.startLamp(); return; }                  // 요거트크림: 평타 = 요술램프(누르고 있는 동안 지니 조종)
    const a = stage === 1 ? this.def.atk1 : this.def.atk2;
    this.action = { kind: 'atk', stage, a, t: 0, hitSet: new Set(), queued: false };
    if (this.onGround) this.vx = this.facing * a.lunge; else { this.vx *= .6; if (this.vy > 0) this.vy *= .5; }
    this.comboWin = 0;
    if (this.def.id === 'rockstar') Sfx.twang(); else if (!a.proj) Sfx.swing();   // 알로에는 데이터 웨이브가 나가는 순간에 소리
  }
  startSkill() {
    const S = this.def.skill;
    if (S.type === 'charge') {                       // 사워벨트: 쿨타임은 발사(또는 카운터) 순간부터
      this.action = { kind: 'skill', phase: 'charge', t: 0, lv: 0, k: 0, noGrav: false, hitSet: new Set(), trail: 0 };
      P({ type: 'ring', x: this.x, y: this.y - 50, r0: 70, r1: 10, size: 5, color: '#9cff6a', life: .22 });
      Sfx.chargeLv(0);
    } else if (S.type === 'objection') {              // 랑그드샤: 쿨타임은 말풍선이 나타나는(또는 반격하는) 순간부터
      this.action = { kind: 'skill', phase: 'ochg', t: 0, lv: 0, k: 0, noGrav: false, hitSet: new Set() };
      P({ type: 'ring', x: this.x + this.facing * 30, y: this.y - 76, r0: 60, r1: 8, size: 5, color: '#ffb347', life: .22 });
      Sfx.chargeLv(0);
    } else {
      this.skillCd = S.cd;
      this.action = { kind: 'skill', phase: 'wind', t: 0, ext: 0, grab: null, noGrav: false, hitSet: new Set(), trail: 0 };
      if (S.type === 'dash') P({ type: 'ring', x: this.x, y: this.y - 50, r0: 50, r1: 10, size: 5, color: '#ffb347', life: .16 });
      if (S.type === 'thunder') P({ type: 'ring', x: this.x, y: this.y - 50, r0: 60, r1: 8, size: 5, color: '#ff2d64', life: .2 });
      if (S.type === 'summon') this.queueBolts();
      if (S.type === 'blade') {                         // 크림소다: 3스택이면 파도, 아니면 강화 찌르기(스택 +1)
        if (this.stacks >= S.maxStack) { this.action.phase = 'wwind'; Sfx.cast(); P({ type: 'ring', x: this.x, y: this.y - 55, r0: 80, r1: 10, size: 6, color: '#9be7ff', life: .3 }); }
        else { this.stacks++; P({ type: 'ring', x: this.x, y: this.y - 50, r0: 46, r1: 8, size: 4, color: '#9be7ff', life: .14 }); }
      }
      if (S.type === 'steal') { this.action.phase = 'cast'; this.markFoe(); }
      if (S.type === 'drum') {                          // 딸기초코스틱: 즉시 무적, 구름 → 드럼
        const crowd = S.crowd && this.others().filter(f => f.stocks > 0).length >= 2 ? S.crowd : null;
        const cfg = crowd ? Object.assign({}, S, crowd) : S;          // 난전이면 crowd 값(체력·쿨·음파 위력)으로 덮어씀
        Object.assign(this.action, { phase: 'build', drum: true, cfg, hp: cfg.hp, maxHp: cfg.hp, cd: cfg.cd, life: S.life, beats: 0, beatT: 0, show: 0, showF: 'd2', hurtT: 0 });
        this.skillCd = 99; this.vx = 0; this.guarding = false;
        Sfx.cast(); P({ type: 'ring', x: this.x, y: this.y - 40, r0: 20, r1: 110, size: 6, color: '#ffc4dc', life: .35 });
        for (let i = 0; i < 12; i++) P({ type: 'dot', x: this.x + rand(-70, 70), y: this.y - rand(0, 40), vx: rand(-40, 40), vy: -rand(40, 140), drag: 2, size: rand(8, 16), color: 'rgba(255,230,240,.9)', life: rand(.4, .7) });
      }
      if (S.type === 'hack') {                          // 알로에: 노트북을 꺼내 6자리 0·1 코드를 입력 (쿨은 끝난 뒤부터)
        const code = Array.from({ length: S.len }, () => Math.random() < .5 ? 0 : 1);
        Object.assign(this.action, { phase: 'type', hack: true, code, idx: 0, left: S.limit, bump: 0, pad: [0, 0], wrong: false });
        this.skillCd = 99; this.vx = 0; this.guarding = false; this.ctrl.bits.length = 0;
        Sfx.cast();
        P({ type: 'ring', x: this.x, y: this.y - 40, r0: 70, r1: 14, size: 5, color: '#43ff86', life: .3 });
        for (let i = 0; i < 10; i++) P({ type: 'text', x: this.x + rand(-50, 50), y: this.y - rand(10, 110), vx: rand(-30, 30), vy: -rand(40, 110), drag: 1.5, life: rand(.4, .7), txt: Math.random() < .5 ? '0' : '1', color: '#7dffa0', size: rand(14, 22) });
      }
      if (S.type === 'train') {                         // 밀키웨이: 호루라기 (쿨은 동작이 끝난 뒤부터)
        const crowd = S.crowd && this.others().filter(f => f.stocks > 0).length >= 2;      // 난전(적 2명 이상)이면 쿨이 더 김
        Object.assign(this.action, { phase: 'whistle', train: true, tr: null, fly: false, laneY: this.y, dir: this.facing, sfx: 0, cdv: crowd && S.crowd.cd ? S.crowd.cd : S.cd });
        this.skillCd = 99; this.vx = 0; this.guarding = false;
        Sfx.whistle();
        P({ type: 'ring', x: this.x + this.facing * 26, y: this.y - 62, r0: 8, r1: 56, size: 5, color: '#d9d3ff', life: .3 });
        for (let i = 0; i < 6; i++) P({ type: 'text', x: this.x + this.facing * rand(20, 60), y: this.y - rand(50, 90), vx: this.facing * rand(30, 110), vy: -rand(20, 80), drag: 1.5, life: rand(.4, .7), txt: Math.random() < .5 ? '♪' : '★', color: '#e6e0ff', size: rand(18, 26) });
      }
      if (S.type === 'carpet') {                        // 요거트크림: 파란 램프를 꺼내는 선딜 (공중에선 천천히 떨어짐). 쿨은 비행이 끝난 뒤부터
        Object.assign(this.action, { carpet: true, hits: null });
        this.skillCd = 99; this.guarding = false;
        if (!this.onGround) { this.vx *= .5; if (this.vy > S.slow) this.vy = S.slow; }
        Sfx.lamp(false);
        P({ type: 'ring', x: this.x + this.facing * 20, y: this.y - 60, r0: 60, r1: 10, size: 5, color: '#7fd0ff', life: .3 });
        for (let i = 0; i < 8; i++) P({ type: 'star', x: this.x + this.facing * rand(10, 44), y: this.y - rand(40, 90), vx: rand(-60, 60), vy: -rand(20, 100), drag: 2, size: rand(5, 9), color: i % 2 ? '#fff3b0' : '#9fe0ff', life: rand(.35, .6), vr: 5 });
      }
      if (S.type === 'mug') {                           // 코코아: 시전 즉시 무적, 코코아가 든 머그잔을 타고 수직 상승. 쿨은 상승이 끝난 뒤부터
        Object.assign(this.action, { phase: 'rise', mug: true, hits: new Map(), caught: new Set(), noGrav: true, sp: 0 });
        this.skillCd = 99; this.guarding = false; this.vx = 0; this.vy = -S.v0; this.onGround = false; this.ys.nm++;
        Sfx.mug(); game.shake = Math.max(game.shake, 6);
        banner('코코아 너무 좋아!', { size: coarse ? 40 : 46, color: '#ffd2a1', y: H * (coarse ? .3 : .26), life: .8 });
        P({ type: 'ring', x: this.x, y: this.y - 20, r0: 20, r1: 120, size: 7, color: '#ffc78f', life: .3 });
        for (let i = 0; i < 12; i++) { const an = -Math.PI / 2 + rand(-1.1, 1.1), sp = rand(160, 420); P({ type: 'dot', x: this.x + rand(-30, 30), y: this.y - rand(0, 24), vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, g: 900, size: rand(5, 11), color: i % 3 ? '#6b2a12' : '#fff3e4', life: rand(.35, .65) }); }
      }
      if (S.type === 'chess') this.chessStart();
      if (S.type === 'rider') { this.action.phase = 'mount'; Sfx.roar(); P({ type: 'ring', x: this.x, y: this.y - 50, r0: 70, r1: 12, size: 5, color: '#ffc83d', life: .2 }); }
      if (S.type === 'slide') {                         // 락스타: 준비 동작 없이 곧바로 슬라이딩
        this.action.phase = 'slide'; Sfx.riff(); game.shake = Math.max(game.shake, 4);
        floatText(this.x + this.facing * 20, this.y - this.def.h - 40, 'ROCK!', '#bfe3ff', 32);
        dust(this.x, this.y, 8, -this.facing);
      }
    }
    if (this.onGround) this.vx *= .2;
  }
  endAction() {
    const a = this.action;
    if (a && a.grab && a.grab.grabbedBy === this) { a.grab.grabbedBy = null; a.grab.hitstun = Math.max(a.grab.hitstun, .15); }
    cancelBolts(a);
    this.action = null;
    if (a && a.train) { const S = this.def.skill, cd = a.phase === 'whistle' ? S.failCd : (a.cdv || S.cd); this.skillCd = cd; this.lastCd = cd; }   // 밀키웨이: 호루라기 중에 끊기면 짧은 쿨, 그 뒤엔 정상 쿨
    if (a && a.mug) { const S = this.def.skill; this.skillCd = S.cd; this.lastCd = S.cd; }   // 코코아: 상승이 끝난 뒤부터 쿨
    if (a && a.chess) this.chessEnd();                                                            // 체스초코: 탈것에서 내림 + 끝난 뒤부터 쿨
    if (a && a.carpet) { const S = this.def.skill; this.skillCd = S.cd; this.lastCd = S.cd; }   // 양탄자: 선딜 중에 끊겨도, 비행을 마쳐도 같은 쿨(동작이 끝난 뒤부터)
    if (a && a.lamp) { const L = this.def.lamp, cd = L.cd + L.cdUse * (a.used || 0); this.lampCd = cd; this.lampCdMax = cd; }   // 램프를 거두면 잠깐 못 꺼냄(오래 쓸수록 조금 더)
    if (a && a.hack) { const S = this.def.skill, cd = a.phase === 'burst' ? S.cd : S.failCd; this.skillCd = cd; this.lastCd = cd; }   // 알로에: 실패 모션 중 맞는 등 중간에 끊겨도 쿨은 정상적으로 돎(정상 종료는 hackEnd가 다시 정함)
  }
  interrupt() { this.endAction(); this.comboWin = 0; }

  updateAction(dt, c) {
    const act = this.action;
    if (act.lamp) { this.lampUpdate(dt, c); return; }
    if (act.kind === 'atk') {
      const a = act.a; act.t += dt;
      if (this.onGround) this.vx = approach(this.vx, 0, 1500 * dt);
      if (act.stage === 1 && c.buf.attack > 0 && act.t > .04) { c.buf.attack = 0; act.queued = true; }
      if (a.proj) {                                         // 알로에: 근접 판정 없이 데이터 웨이브를 날림
        if (!act.fired && act.t >= a.on) { act.fired = true; spawnDataWave(this, a); }
      } else if (act.t >= a.on && act.t <= a.off) {
        const box = this.box(a.box);
        for (const f of this.foes()) {
          if (act.hitSet.has(f) || !overlap(box, f.hurt())) continue;
          act.hitSet.add(f);
          const r = applyHit(this, f, this.stolen > 0 ? Object.assign({}, a, { dmg: Math.round(a.dmg * this.def.skill.buff.dmgMul) }) : a);
          if (r === 'hit' && f.mark && f.mark.owner === this && this.markHit(f)) return;      // 괴도: 표식 맞힌 횟수 → 5번째면 보석 강탈
          if (r === 'hit' && !f.minion && this.def.skill.cdPerHit && this.skillCd > 0) {     // 크림소다: 평타 적중 시 필살기 쿨 감소
            this.skillCd = Math.max(0, this.skillCd - this.def.skill.cdPerHit);
            floatText(this.x, this.y - this.def.h - 34, '쿨 -1초', '#9be7ff', 18);
          }
          if (this.action !== act) return;                  // 카운터를 맞으면 즉시 중단
        }
      }
      if (act.queued && act.t >= a.cancel) { this.action = null; this.startAttack(2); return; }
      if (act.t >= a.total) { this.action = null; if (act.stage === 1) this.comboWin = .22; }
      return;
    }
    const type = this.def.skill.type;
    if (type === 'grab') this.velvetSkill(dt);
    else if (type === 'dash') this.plumSkill(dt);
    else if (type === 'thunder') this.darkSkill(dt);
    else if (type === 'summon') this.licoriceSkill(dt);
    else if (type === 'slide') this.rockstarSkill(dt);
    else if (type === 'blade') this.creamSkill(dt);
    else if (type === 'rider') this.jungleSkill(dt);
    else if (type === 'steal') this.thiefSkill(dt);
    else if (type === 'drum') this.drumSkill(dt, c);
    else if (type === 'hack') this.hackSkill(dt, c);
    else if (type === 'train') this.trainSkill(dt, c);
    else if (type === 'carpet') this.carpetSkill(dt, c);
    else if (type === 'mug') this.mugSkill(dt, c);
    else if (type === 'chess') this.chessSkill(dt, c);
    else if (type === 'objection') this.objSkill(dt, c);
    else this.sourSkill(dt, c);
  }

  /* 알로에 펄스 해킹: 코드 입력(type) → 성공(burst: 화면 전체 전파) / 실패(fail: 잠깐 무방비). F=0 · G=1(또는 숫자 0·1). 입력·성공 중엔 슈퍼아머 */
  hackSkill(dt, c) {
    const S = this.def.skill, act = this.action; act.t += dt;
    this.vx = approach(this.vx, 0, 3000 * dt); this.guarding = false; c.buf.jump = 0; c.buf.drop = 0;
    act.bump = Math.max(0, act.bump - dt); act.pad[0] = Math.max(0, act.pad[0] - dt); act.pad[1] = Math.max(0, act.pad[1] - dt);
    if (act.phase === 'type') {
      act.left -= dt;
      const bits = [];
      if (c.buf.attack > 0) { c.buf.attack = 0; bits.push(0); }
      if (c.buf.skill > 0) { c.buf.skill = 0; bits.push(1); }
      while (c.bits.length) bits.push(c.bits.shift());
      for (const b of bits) {
        act.pad[b] = .14; act.bump = .09;
        if (b !== act.code[act.idx]) { this.hackFail('오류!'); return; }
        act.idx++; Sfx.key(act.idx);
        P({ type: 'text', x: this.x + rand(-26, 26), y: this.y - this.def.h - 6, vx: rand(-30, 30), vy: -rand(50, 100), drag: 1.5, life: .4, txt: String(b), color: '#9dffbd', size: 20 });
        if (act.idx >= S.len) { this.hackSuccess(); return; }
      }
      if (act.left <= 0) this.hackFail('시간 초과!');
    } else if (act.phase === 'burst') {
      if (Math.random() < .5) P({ type: 'dot', x: this.x + rand(-40, 40), y: this.y - rand(0, 110), vx: rand(-40, 40), vy: -rand(80, 220), drag: 1.5, size: rand(3, 6), color: '#7dffa0', life: rand(.3, .5), add: true });
      if (act.t >= S.burstT) { this.waveBuff = S.waveBuffT; floatText(this.x, this.y - this.def.h - 34, `웨이브 연장 ${S.waveBuffT}초!`, '#9dffbd', 26); P({ type: 'ring', x: this.x, y: this.y - 8, r0: 14, r1: 74, size: 5, color: '#43ff86', life: .35 }); this.hackEnd(S.cd); }
    } else if (act.phase === 'fail') {
      if (act.t >= S.failT) this.hackEnd(S.failCd);
    }
  }
  hackEnd(cd) { this.endAction(); this.skillCd = cd; this.lastCd = cd; }
  hackFail(msg) {
    const act = this.action; act.phase = 'fail'; act.t = 0; act.wrong = true;
    Sfx.error(); game.shake = Math.max(game.shake, 4);
    floatText(this.x, this.y - this.def.h * .55, msg, '#ff6b7e', 30);
    for (let i = 0; i < 10; i++) { const an = rand(0, Math.PI * 2), sp = rand(100, 300); P({ type: 'shard', x: this.x, y: this.y - 60, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 80, g: 800, size: rand(4, 7), color: i % 2 ? '#ff4f6a' : '#7dffa0', rot: rand(0, 6), vr: rand(-10, 10), life: rand(.4, .6) }); }
  }
  /* 코드 입력 성공: 화면 전체 전파. 모든 적(해골젤리 포함)에게 가드를 뚫는 피해, 적 쿠키는 필살기 hackT초 봉인 */
  hackSuccess() {
    const S = this.def.skill, act = this.action;
    act.phase = 'burst'; act.t = 0;

  /* 밀키웨이 꿈의 열차: 호루라기(whistle) → 하늘로 도약(leap, 무적) → 열차 탑승(ride, 무적) → [G: 하차] 또는 [열차가 다 지나가면 drop: 무대 정중앙으로 낙하] → 착지(land) */

  /* 요거트크림 평타 — 요술램프: 초록(기본) / 빨간(초록 지니로 준 피해 누적 need% 이상이면 강화).
     draw(램프를 꺼냄, 아직 맞으면 끊김) → focus(지니 조종 · 슈퍼아머 · 최대 max초, F를 떼면 끝, 최소 minFocus초) → rec(거두는 동작) */
  startLamp() {

  /* =====================================================================

  chessStart() {

    P({ type: 'ring', x: this.x, y: this.y - 50, r0: 10, r1: 100, size: 7, color: white ? '#ffe9a6' : '#d9a878', life: .32 });
    for (let i = 0; i < 12; i++) P({ type: 'star', x: this.x + rand(-50, 50), y: this.y - rand(10, 120), vx: rand(-60, 60), vy: -rand(20, 120), drag: 2, size: rand(6, 11), color: i % 2 ? (white ? '#fff3b0' : '#e8c9a0') : '#fff', life: rand(.35, .65), vr: 5 });

  chessSkill(dt, c) {
    const act = this.action; act.t += dt; act.tot += dt;
    c.buf.attack = 0; c.buf.jump = 0; c.buf.drop = 0; c.buf.skill = 0; this.guarding = false;

  }
  /* 퀸 내려찍기: wind(공중에 멈춰 퀸이 나타남) → drop(수직 낙하) → land(착지 충격파 · 후딜) */

      if (act.t >= Q.wind) {
        act.phase = 'drop'; act.t = 0; this.vx = 0; this.vy = Q.vy; this.onGround = false;
        Sfx.queenDrop();
        P({ type: 'ring', x: this.x, y: this.y - 80, r0: 70, r1: 14, size: 6, color: '#fff0b0', life: .2 });
      }
      return;
    }
    if (act.phase === 'drop') {
      this.vx = 0; this.vy = Q.vy; act.fall += Q.vy * dt;
      act.sp -= dt;
      if (act.sp <= 0) { act.sp = .02; P({ type: 'line', x: this.x + rand(-80, 80), y: this.y - rand(60, 220), vx: 0, vy: -rand(300, 700), drag: 4, len: rand(30, 70), size: rand(3, 5), color: Math.random() < .5 ? '#fff6c8' : '#ffe08a', life: rand(.15, .3) }); }
      const box = { l: this.x - Q.box.hx, r: this.x + Q.box.hx, t: this.y - Q.box.t, b: this.y + Q.box.b };
      for (const foe of this.foes()) {

        const dir = foe.x >= this.x ? 1 : -1;
        const r = applyHit(this, foe, { dmg: Q.hit.dmg, kb: Q.hit.kb, angle: foe.onGround ? 58 : -48 }, { x: foe.x, y: foe.y - foe.def.h * .5 }, dir);   // 땅 위의 적은 비스듬히 위로, 공중의 적은 아래로 찍힘
        if (!r) continue;

  /* 다그닥 나이트: wind → 바라보던 방향으로 평각 도약 hops번(바닥에 닿을 때마다 튕겨 올라 다시 도약, 도약마다 적을 한 번씩 침) → rec(후딜) */

      act.sp -= dt;
      if (act.sp <= 0) { act.sp = .03; P({ type: 'star', x: this.x - act.dir * rand(40, 120), y: this.y - rand(6, 70), vx: -act.dir * rand(40, 160), vy: rand(-60, 40), drag: 2.5, size: rand(5, 9), color: Math.random() < .5 ? '#e8c9a0' : '#fff3d6', life: rand(.25, .5), vr: 5 }); }
      const box = this.box(Q.box);
      for (const foe of this.foes()) {
        if (foe.dead || act.hits.has(foe) || !overlap(box, foe.hurt())) continue;
        const r = applyHit(this, foe, Q.hit, { x: (this.x + foe.x) / 2 + act.dir * 20, y: foe.y - foe.def.h * .5 }, act.dir);
        if (!r) continue;

        if (r === 'hit') { this.ys.hk++; act.slow = Q.slow; }                    // 부딪히면 속도가 줄어 같은 적을 다음 도약에서 또 칠 수 있음
        if (r === 'hit') for (let k = 0; k < 10; k++) P({ type: 'star', x: foe.x + rand(-16, 16), y: foe.y - rand(10, 90), vx: act.dir * rand(100, 420), vy: -rand(40, 280), g: 700, size: rand(6, 10), color: k % 2 ? '#f0c79a' : '#ffffff', life: rand(.35, .6), vr: 5 });

  /* 필살기 끝(정상·맞아서 끊김 모두): 파트너가 탈것에서 내리고 쿨 시작 */

  /* F를 꾹 누르면 리더 교체: 두 쿠키가 가까울 때만. 둘 다 가만히 서 있는(공격·경직 없는) 순간에 몸을 맞바꿈 */

  /* F 꾹 누르는 중: 두 쿠키를 잇는 선과 리더 둘레에 차오르는 고리 */
  drawSwapRing(g) {

/* 쿠키를 고르면 지금 칸을 채우고 다음 빈 칸으로. 다른 칸에 있던 쿠키면 두 칸을 맞바꿈(같은 쿠키는 한 경기에 한 번) */
function pickCookie(id) {
  const p = picks(), a = game.active, other = p.indexOf(id);
  if (other !== a) { if (other >= 0) p[other] = p[a]; p[a] = id; }
  for (let k = 1; k <= p.length; k++) { const j = (a + k) % p.length; if (!p[j]) { game.active = j; break; } }
}
function setRadio(seg, btn) { for (const x of seg.querySelectorAll('button')) x.setAttribute('aria-checked', String(x === btn)); }
function updateSelect() {
  const p = picks(), tags = MODES[game.mode].tags;
  selectEl.dataset.mode = game.mode;
  $('#s-mode').textContent = MODES[game.mode].title;
  slotEls.forEach((el, i) => {
    const prev = i === game.active && game.hoverId && game.hoverId !== p[i] ? game.hoverId : null, id = prev || p[i] || '';
    el.classList.toggle('is-active', i === game.active); el.classList.toggle('is-empty', !id); el.classList.toggle('is-preview', !!prev);

function fitCanvas(cv) {

}
/* 키 설정 화면 */
const ksBody = $('#ks-body'), ksMsg = $('#ks-msg');
let keyCapture = null;                     // { id, i } 키 입력을 기다리는 칸
const actName = id => ACTS.find(a => a.id === id).name;
ksBody.innerHTML = ACTS.map(a => `<div class="ks-row" data-act="${a.id}"><div class="ks-name"><b>${a.name}</b>${a.sub ? `<small>${a.sub}</small>` : ''}<span class="ks-none">키 없음</span></div>
  <div class="ks-keys">${Array.from({ length: KEY_SLOTS }, (_, i) => `<button type="button" class="kc" data-i="${i}"></button>`).join('')}</div></div>`).join('');
for (const row of ksBody.querySelectorAll('.ks-row')) for (const b of row.querySelectorAll('.kc')) b.addEventListener('click', () => {
  Sfx.init(); Sfx.select();
  const id = row.dataset.act, i = Math.min(+b.dataset.i, keyBinds[id].length);   // 빈 칸은 앞에서부터 채움

// 칸 밖을 누르면 입력 취소
keysetEl.addEventListener('pointerdown', e => { if (keyCapture && !e.target.closest('.kc')) endCapture(''); });
function renderKeyset(flash) {
  for (const row of ksBody.querySelectorAll('.ks-row')) {
    const id = row.dataset.act, list = keyBinds[id];
    row.classList.toggle('is-none', !list.length);
    row.querySelectorAll('.kc').forEach((b, i) => {
      const c = list[i], cap = !!keyCapture && keyCapture.id === id && keyCapture.i === i;
      b.classList.toggle('is-empty', !c && !cap); b.classList.toggle('is-cap', cap);
      b.classList.remove('is-new'); if (flash && flash.id === id && flash.i === i) { void b.offsetWidth; b.classList.add('is-new'); }

function endCapture(msg) { keyCapture = null; renderKeyset(); if (msg != null) ksMsg.textContent = msg; }
function commitKeys(flash) { setBinds(keyBinds); saveBinds(); renderKeyset(flash); renderKeyHints(); }
function captureKey(e) {
  if (e.code === 'Tab') { endCapture(''); return; }                       // 키보드로 칸을 옮겨 다닐 수 있게
  e.preventDefault(); if (e.repeat) return;

  if (e.code === 'KeyM') { ksMsg.textContent = 'M은 소리 켜기/끄기 전용이라 쓸 수 없어요. 다른 키를 누르세요'; return; }
  const c = normCode(e.code), j = L.indexOf(c), prev = keyAct[c];
  let msg;
  if (j >= 0) {                                                             // 같은 동작 안에서는 자리만 바꿈
    if (i < L.length) [L[i], L[j]] = [L[j], L[i]];
    msg = `${actName(id)}: ${keyLabel(c)}`;
  } else {
    if (prev) keyBinds[prev] = keyBinds[prev].filter(x => x !== c);       // 다른 동작에 쓰던 키면 거기서 뺌
    const old = L[i];
    if (i < L.length) L[i] = c; else L.push(c);

  }
  keyCapture = null; commitKeys({ id, i: keyBinds[id].indexOf(c) });
  const empty = ACTS.filter(a => !keyBinds[a.id].length).map(a => a.name);

}
/* 메인 화면 아래 조작 안내도 설정한 키로 */
function renderKeyHints() {
  const hk = (id, n) => keysOf(id).slice(0, n).map(l => `<kbd>${esc(l)}</kbd>`).join('/') || '<kbd>–</kbd>';
  menuEl.querySelector('.keys').innerHTML = [[hk('left', 1) + hk('right', 1), '이동'], [hk('jump', 2), '점프 (공중 2단)'], [hk('down', 2), '발판 아래로'],
    [hk('attack', 1), '기본 공격'], [hk('skill', 1), '필살기'], [hk('guard', 2), '가드'], [hk('pause', 1) + '/<kbd>Esc</kbd>', '일시정지']].map(([k, t]) => `<span>${k} ${t}</span>`).join('');
}
renderKeyHints();
function showKeyset() {
  game.scene = 'keys'; clearWorld(); setBackdrop('cake'); keyCapture = null; ksMsg.textContent = '';
  menuEl.hidden = true; selectEl.hidden = true; resultEl.hidden = true; touchEl.hidden = true; keysetEl.hidden = false; cornerEl.hidden = false;

$('#m-keys').addEventListener('click', () => { Sfx.init(); Sfx.select(); showKeyset(); });
$('#ks-back').addEventListener('click', () => { Sfx.select(); showMenu(); });
$('#ks-done').addEventListener('click', () => { Sfx.select(); showMenu(); });
$('#ks-reset').addEventListener('click', () => { Sfx.select(); keyCapture = null; setBinds(null); commitKeys(); ksMsg.textContent = '기본 키로 되돌렸어요'; });
for (const b of menuEl.querySelectorAll('.mode')) b.addEventListener('click', () => { Sfx.init(); Sfx.select(); showSelect(b.dataset.mode); });
$('#back').addEventListener('click', () => { Sfx.select(); showMenu(); });
for (const b of document.querySelectorAll('#lv-seg button')) b.addEventListener('click', () => { game.level = b.dataset.lv; Sfx.init(); Sfx.select(); setRadio($('#lv-seg'), b); });
for (const b of document.querySelectorAll('#tm-seg button')) b.addEventListener('click', () => { game.timeLimit = +b.dataset.tm; Sfx.init(); Sfx.select(); setRadio($('#tm-seg'), b); });

startBtn.addEventListener('click', () => { Sfx.init(); if (coarse) goFullscreen(); startMatch(); });

function toggleMute() { Sfx.on = !Sfx.on; muteBtn.textContent = Sfx.on ? '소리 켜짐 · M' : '소리 꺼짐 · M'; muteBtn.setAttribute('aria-pressed', String(!Sfx.on)); }
muteBtn.addEventListener('click', () => { Sfx.init(); toggleMute(); muteBtn.blur(); });
/* 전체 화면: 지원되는 곳(자체 사이트 등)에서만 버튼을 보여줌 */
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsOk = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

  const lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.then) r.then(lock, () => {}); else lock(); } catch (e) { /* 전체 화면을 쓸 수 없는 환경 */ }
}

for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { fsBtn.textContent = fsOn() ? '전체 화면 끄기' : '전체 화면'; });
$('#pause').addEventListener('pointerdown', e => { e.preventDefault(); if (game.scene === 'fight' || game.scene === 'countdown') game.paused = !game.paused; });

/* ---------- 터치 조작 ----------
   손가락(identifier)마다 누른 컨트롤을 기억하고, 터치 이벤트가 올 때마다 '지금 화면에 실제로 닿아 있는 손가락'(e.touches)과 대조한다.
   → 손가락을 뗀 이벤트를 놓치거나(시스템 제스처·알림창), 누른 채로 경기가 끝나고 화면이 바뀌어도 '눌림'이 남지 않음.

const TC_ACTS = ['left', 'right', 'down', 'guard', 'skill', 'jump', 'attack'];
const TOUCH_EV = coarse && 'ontouchstart' in window;

for (const a of TC_ACTS) tcEls[a] = [];
for (const el of pad.querySelectorAll('.pk')) { const k = el.dataset.dir === 'up' ? 'jump' : el.dataset.dir; padKeys[k] = padKeys[k] || el; tcEls[k].push(el); }   // ▲는 점프(= 위) 키
for (const b of touchEl.querySelectorAll('button[data-act]')) tcEls[b.dataset.act].push(b);
function localPoint(el, cx, cy) {
  const r = el.getBoundingClientRect();
  return rotated ? { x: cy - r.top, y: r.right - cx, w: r.height, h: r.width } : { x: cx - r.left, y: cy - r.top, w: r.width, h: r.height };
}
function padDirs(e) {
  const p = localPoint(pad, e.clientX, e.clientY), a = [];     // 3×3 칸 중 손가락이 있는 칸. 가운데는 아무것도 안 눌림, 모서리는 대각선

}
/* 손가락 목록 → 눌린 동작 목록으로 맞춤(바뀐 것만 press) */
function tcApply() {

  for (const f of tcFinger.values()) for (const a of f.acts) want.add(a === 'up' ? 'jump' : a);

    if (on && !tcOn.has(act)) { tcOn.add(act); press(act, true); }

const tcReset = () => { tcFinger.clear(); tcApply(); };
if (TOUCH_EV) {
  const onPauseMenu = e => !!(e.target && e.target.closest && e.target.closest('#pausemenu'));

}
/* 조작 UI가 사라지거나 앱이 가려질 때, 화면이 돌아갈 때는 눌림을 전부 풀어 줌 */

if (coarse) {

buildFx();

requestAnimationFrame(loop);
loadImages().then(() => {
  for (const k in sheets) sils[k] = makeSil(sheets[k]);

})();
